[project]
name = "amide"
version = "0.3.0"
description = "A molecular dynamics CLI."
license = "GPL-3.0-or-later"
license-files = ["COPYING"]
requires-python = ">=3.11"
dependencies = ["typer>=0.12"]
readme = "README.md"
keywords = ["molecular-dynamics", "pdb", "terminal", "tui", "visualization"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://amide.cyruscorrell.com/"
Documentation = "https://amide.cyruscorrell.com/docs.md"
Source = "https://github.com/CyrusCorrell0/amide"
Changelog = "https://github.com/CyrusCorrell0/amide/blob/main/CHANGELOG.md"

[project.scripts]
amide = "amide.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.sdist]
exclude = ["*.png", "*.exe", "/tui/amide-tui", "/tui/dist", "/.playwright-mcp", "*.stackdump"]
