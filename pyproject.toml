[project]
name = "amide"
version = "0.1.0"
description = "A molecular dynamics CLI."
license = "GPL-3.0-or-later"
license-files = ["COPYING"]
requires-python = ">=3.11"
dependencies = ["typer>=0.12", "pyyaml>=6"]

[project.optional-dependencies]
# `amide` alone is the lite install: the harness plus the tools that only need
# the network. Each extra below unlocks a group of builtin tools; `amide tools
# check` reports which are missing on this machine.
sim = ["openmm>=8", "pdbfixer>=1.10", "MDAnalysis>=2.7"]
chem = ["rdkit>=2024.3"]
westpa = ["westpa>=2022"]
full = ["amide[sim,chem,westpa]"]

[project.scripts]
amide = "amide.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# typer reads the Option/Argument call as the parameter's declaration.
"src/amide/cli.py" = ["B008"]
